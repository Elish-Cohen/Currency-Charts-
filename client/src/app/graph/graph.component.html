<div class="seconsE">
<div class="controls">
<div class="inline-item">
  <select   [(ngModel)]="chartType">
     <option value="" disabled selected hidden>Select a graph type</option>
    <option value="line">line</option>
    <option value="bar">bar</option>
    <option value="pie">pie</option>
  </select>
</div>
<div>
<button (click)="showGraph=true" (click)="ngOnChanges()" >Show graph</button>

</div>
<div *ngIf="loading"  class="spinner"></div>
<div *ngIf="!loading" >
  <echarts [options]="chartOptions" class="demo-chart"></echarts>
</div>
</div>
